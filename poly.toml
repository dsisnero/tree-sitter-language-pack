[discovery]
exclude = [
    "**/*.freezed.dart",
    "**/*.g.dart",
    "**/*.jinja",
    "**/*.lock",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    ".alef/**",
    "artifacts/**",
    "dist/**",
    "docs/assets/**",
    "docs/snippets/**",
    "fixtures/**",
    "node_modules/**",
    "readme_templates/**",
    "target/**",
    "templates/readme/**",
    "test_documents/**",
    "vendor/**",
    "**/Cargo.toml",
    "**/_generated/**",
    "**/coverage/**",
    "**/pkg/**",
    "**/.next/**",
    "**/*.min.js",
    "templates/**",
]

[lint.markdown.rumdl]
disable = [
    "MD012",
    "MD013",
    "MD024",
    "MD033",
    "MD036",
    "MD041",
    "MD046",
    "MD051",
    "MD076",
]

[fmt.markdown.rumdl]
disable = [
    "MD012",
    "MD013",
    "MD024",
    "MD033",
    "MD036",
    "MD041",
    "MD046",
    "MD051",
    "MD076",
]

